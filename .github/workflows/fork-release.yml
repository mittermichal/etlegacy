# Fork-only release pipeline.
#
# Builds the mod libraries (cgame/ui/qagame/tvgame) for Linux, Windows and macOS,
# merges them into the legacy pk3 the same way build.yml's mod-merger does, and
# publishes the result as workflow artifacts and (optionally) a GitHub Release.
#
# No Android, no code signing, no etlegacy.com upload - none of those secrets
# exist in a fork. build.yml is intentionally left untouched so upstream merges
# stay clean.
name: ForkRelease

on:
  workflow_dispatch:
    inputs:
      lnx32:
        description: "Build 32bit Linux mod libs"
        type: boolean
        default: true
      lnx_aarch64:
        description: "Build aarch64 Linux mod libs (cross-compiled)"
        type: boolean
        default: true
      osx:
        description: "Build macOS mod libs"
        type: boolean
        default: true
      win32:
        description: "Build 32bit Windows mod libs"
        type: boolean
        default: true
      win64:
        description: "Build 64bit Windows mod libs"
        type: boolean
        default: true
      release_tag:
        description: "Tag to publish a GitHub Release at (leave empty for artifacts only)"
        type: string
        default: ""
      prerelease:
        description: "Mark the release as a pre-release"
        type: boolean
        default: true

# 64bit Linux is always built: it is the only job producing the base pk3.
jobs:
  pre-build:
    runs-on: ubuntu-latest
    outputs:
      describe: ${{ steps.git.outputs.describe }}
      tag: ${{ steps.git.outputs.tag }}
      uid: ${{ steps.git.outputs.uid }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch git version information
        id: git
        run: |
          git fetch --tags --force
          git_describe=$(git describe --abbrev=7 2>/dev/null | awk '{$1=$1};1')
          git_tag=$(git describe --abbrev=0 2>/dev/null | awk '{$1=$1};1')
          # Never let an empty describe through, it would produce "etlegacy-mod-.zip"
          git_describe=${git_describe:-$(cat VERSION.txt)-fork}
          git_tag=${git_tag:-$(cat VERSION.txt)}
          ci_id=$(uuidgen)
          echo "Version info: $git_describe ?? $git_tag"
          {
            echo "describe=$git_describe"
            echo "tag=$git_tag"
            echo "uid=$ci_id"
          } >> "$GITHUB_OUTPUT"

  #   __  __               _
  #  |  \/  |  ___   __ _ | |
  #  | |\/| | / _ \ / _` || |
  #  |  \/  || (_) | (_| || |
  #  |_|  |_| \___/ \__,_||_|  generation

  lnx64-mod:
    runs-on: ubuntu-24.04
    needs: pre-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{needs.pre-build.outputs.describe}} -e CI_ETL_TAG=${{needs.pre-build.outputs.tag}} -e CI_ETL_UID=${{needs.pre-build.outputs.uid}} -e CI=true
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -64 -mod

      - uses: actions/upload-artifact@v4
        with:
          name: lnx64-mod
          path: |
            build/legacy/cgame*.so
            build/legacy/ui*.so
            build/legacy/qagame*.so
            build/legacy/tvgame*.so
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: incomplete-mod-pk3
          path: build/legacy/legacy_*.pk3
          if-no-files-found: error

  lnx32-mod:
    runs-on: ubuntu-24.04
    needs: pre-build
    if: ${{ inputs.lnx32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        uses: maus007/docker-run-action-fork@v1
        with:
          image: etlegacy/lnx-build:latest
          options: -v ${{ github.workspace }}:/code -e CI_ETL_DESCRIBE=${{needs.pre-build.outputs.describe}} -e CI_ETL_TAG=${{needs.pre-build.outputs.tag}} -e CI_ETL_UID=${{needs.pre-build.outputs.uid}} -e CI=true
          run: |
            git config --global --add safe.directory /code
            ./easybuild.sh build -mod

      - uses: actions/upload-artifact@v4
        with:
          name: lnx32-mod
          path: |
            build/legacy/cgame*.so
            build/legacy/ui*.so
            build/legacy/qagame*.so
            build/legacy/tvgame*.so
          if-no-files-found: error

  lnx-aarch64-mod:
    runs-on: ubuntu-24.04
    needs: pre-build
    if: ${{ inputs.lnx_aarch64 }}
    container:
      image: etlegacy/lnx-aarch64-build
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          ./easybuild.sh build -RPIT -mod -ninja

      - uses: actions/upload-artifact@v4
        with:
          name: lnx-aarch64-mod
          path: |
            build/legacy/cgame*.so
            build/legacy/ui*.so
            build/legacy/qagame*.so
            build/legacy/tvgame*.so
          if-no-files-found: error

  osx-mod:
    runs-on: macos-14
    needs: pre-build
    if: ${{ inputs.osx }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: brew bundle

      - name: Build
        env:
          SDKROOT: /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk
          DEVELOPER_DIR: /Library/Developer/CommandLineTools
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        shell: bash
        run: |
          ./easybuild.sh build -64 -mod --osx=10.10 --osx-arc="x86_64;arm64" -j

      - uses: actions/upload-artifact@v4
        with:
          name: osx-mod
          path: |
            build/legacy/cgame_mac
            build/legacy/ui_mac
            build/legacy/qagame_mac
            build/legacy/tvgame_mac
          if-no-files-found: error

  win-mod:
    runs-on: windows-2022
    needs: pre-build
    if: ${{ inputs.win32 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod

      - uses: actions/upload-artifact@v4
        with:
          name: win-mod
          path: |
            build/legacy/cgame*.dll
            build/legacy/ui*.dll
            build/legacy/qagame*.dll
            build/legacy/tvgame*.dll
          if-no-files-found: error

  win64-mod:
    runs-on: windows-2022
    needs: pre-build
    if: ${{ inputs.win64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Build
        shell: cmd
        env:
          CI_ETL_DESCRIBE: ${{needs.pre-build.outputs.describe}}
          CI_ETL_TAG: ${{needs.pre-build.outputs.tag}}
          CI_ETL_UID: ${{needs.pre-build.outputs.uid}}
        run: |
          call .\easybuild.bat build -mod -64

      - uses: actions/upload-artifact@v4
        with:
          name: win64-mod
          path: |
            build/legacy/cgame*.dll
            build/legacy/ui*.dll
            build/legacy/qagame*.dll
            build/legacy/tvgame*.dll
          if-no-files-found: error

  #   __  __                                
  #  |  \/  | ___  _ __ __ _  ___  _ __ 
  #  | |\/| |/ _ \| '__/ _` |/ _ \| '__|
  #  |  \/  |  __/| | | (_| |  __/| |   
  #  |_|  |_|\___||_|  \__, |\___||_|   
  #                    |___/
  mod-merger:
    runs-on: ubuntu-24.04
    needs: [pre-build, lnx64-mod, lnx32-mod, lnx-aarch64-mod, osx-mod, win-mod, win64-mod]
    # Deselected platforms are skipped, not failed - do not let that skip the merge.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: incomplete-mod-pk3

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-mod"
          path: platforms
          merge-multiple: true

      - name: Create supported platform manifest
        shell: bash
        run: |
          # Only claim the platforms this run actually merged into the pk3.
          # The macOS build is a universal binary, so it covers both arches.
          platforms="lnx_x86_64"
          [ "${{ inputs.lnx32 }}" = "true" ] && platforms="$platforms lnx_x86"
          [ "${{ inputs.lnx_aarch64 }}" = "true" ] && platforms="$platforms lnx_armv8_64"
          [ "${{ inputs.win32 }}" = "true" ] && platforms="$platforms win_x86"
          [ "${{ inputs.win64 }}" = "true" ] && platforms="$platforms win_x86_64"
          [ "${{ inputs.osx }}" = "true" ] && platforms="$platforms macos_x86_64 macos_aarch64"
          echo "$platforms" > platforms.manifest
          cat platforms.manifest

      - name: Merge mod files
        shell: bash
        # No libcgame*/libui* patterns here: those are the android naming and
        # zip -MM (must match) aborts on a pattern that matches nothing.
        run: |
          zip -rvj -MM legacy_*.pk3 platforms.manifest platforms/cgame* platforms/ui*

      - name: Create mod zip
        shell: bash
        run: |
          zip -rvj -MM etlegacy-mod-${{needs.pre-build.outputs.describe}}.zip legacy_*.pk3 platforms/qagame* platforms/tvgame*

      - name: Remove old artifacts
        uses: geekyeggo/delete-artifact@v4
        with:
          failOnError: false
          name: |
            incomplete-mod-pk3
            *-mod

      - uses: actions/upload-artifact@v4
        with:
          name: All-mods
          path: legacy_*.pk3
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: mod-zip
          path: etlegacy-mod-*.zip
          if-no-files-found: error

  #   ____       _
  #  |  _ \ ___ | |  ___  __ _ ___ ___
  #  | |_) / _ \| | / _ \/ _` / __/ _ \
  #  |  _ <  __/| ||  __/ (_| \__ \  __/
  #  |_| \_\___||_| \___|\__,_|___/\___|
  release:
    runs-on: ubuntu-24.04
    needs: [pre-build, mod-merger]
    if: ${{ inputs.release_tag != '' }}
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mod-zip

      - uses: actions/download-artifact@v4
        with:
          name: All-mods

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # There is no checkout in this job, so gh cannot infer the repo from git remotes
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          ls -la
          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG (${{ github.ref_name }})" \
            --target "${{ github.sha }}" \
            --notes "Fork build of ${{needs.pre-build.outputs.describe}} from branch \`${{ github.ref_name }}\` (${{ github.sha }})" \
            ${{ inputs.prerelease && '--prerelease' || '' }} \
            etlegacy-mod-*.zip legacy_*.pk3
